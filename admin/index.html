<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Staff-only portal: never indexed, never framed, no analytics or ad
         pixels. The public site's tracking lives only in site/index.html. -->
    <meta name="robots" content="noindex,nofollow" />
    <meta name="referrer" content="same-origin" />
    <meta name="theme-color" content="#003F8D" />
    <title>Admin | Campos Muños Law</title>
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" type="image/png" href="/favicon-32.png" sizes="32x32" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- Installable as its own app, so its notifications carry its name and icon. -->
    <link rel="manifest" href="%BASE_URL%manifest.webmanifest" />
    <!-- The last theme's background, painted before anything else (no white flash in a dark theme). -->
    <script src="%BASE_URL%theme-boot.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Only the weights the portal sets (Playfair: 400-600 on headings;
         Cormorant: the body text's 400-700, no light or italic, which only
         ever appear in Inter; Inter: 300-600). -->
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600&family=Cormorant+Garamond:wght@400;500;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
