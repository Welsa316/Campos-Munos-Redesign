<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; img-src 'self'">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Campos Muños</title>
<style>
  :root { color-scheme: dark; }
  html, body { height: 100%; margin: 0; }
  body {
    display: grid; place-items: center;
    background: #15213e; color: #eef1f7;
    font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
  }
  main { max-width: 26rem; padding: 2rem; text-align: center; }
  img { width: 56px; height: 56px; margin-bottom: 1.25rem; }
  h1 { font-size: 1.25rem; font-weight: 600; letter-spacing: -0.01em; margin: 0 0 .5rem; }
  p { margin: 0 0 1.5rem; color: #b9c2d6; }
  a {
    display: inline-block; padding: .6rem 1.4rem; border-radius: 999px;
    background: #eef1f7; color: #15213e; font-weight: 600; text-decoration: none;
  }
  a:hover { background: #ffffff; }
  a:focus-visible { outline: 2px solid #eef1f7; outline-offset: 3px; }
</style>
</head>
<body>
<main>
  <img src="icon.png" alt="">
  <h1>Can't reach the portal</h1>
  <p>Check your internet connection. Campos Muños will try again on its own every few seconds.</p>
  <!-- The app sets the real portal address; navigation to it is allowed. -->
  <a id="retry" href="https://admin.camulaw.com/">Try again</a>
</main>
</body>
</html>
